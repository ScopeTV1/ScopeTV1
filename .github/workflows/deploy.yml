name: Deploy Svelte site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify production artifact
        shell: bash
        run: |
          test -f dist/index.html
          grep -q './assets/' dist/index.html
          ! grep -q '/src/main.js' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f | head -n 1)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages uses the workflow source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_config=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          pages_build_type=$(printf '%s' "${pages_config}" | jq -r '.build_type // empty')
          if [ "${pages_build_type}" != "workflow" ]; then
            echo "GitHub Pages is configured as '${pages_build_type:-unknown}', not 'workflow'."
            echo "Set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
